name: Temporary LightArt Studio v1.5 PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v1.5 source
        shell: bash
        run: |
          set -euxo pipefail
          cat v15_payload/part00a v15_payload/part00b v15_payload/part01 v15_payload/part02 v15_payload/part03 v15_payload/part04 v15_payload/part05 v15_payload/part06 v15_payload/part07 v15_payload/part08 > v15_source.b64
          echo 'bf175c4236c56e8ab7738a3e7bd9d750903266114c7134efe6776255f2005f5d  v15_source.b64' | sha256sum -c -
          base64 -d v15_source.b64 > v15_source.zip
          echo 'eb3c603786e6bb8cbb94a41b0ee20320df8d81bcefb442f2c74766772fa982c8  v15_source.zip' | sha256sum -c -
          mkdir LightArtStudio
          unzip -q v15_source.zip -d LightArtStudio
          cp v15_overlay/ScriptWebView.java LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java
          sed -i 's/p5.js 1.11.11/p5.js 2.3.2/g' LightArtStudio/app/src/main/java/com/xperiatk/lightart/MainActivity.java
          grep -q "versionCode 6" LightArtStudio/app/build.gradle
          grep -q "versionName '1.5'" LightArtStudio/app/build.gradle
          grep -q '__laChainPatched' LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java
          grep -q 'p5.webgpu.min.js' LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java

      - name: Bundle official p5.js 2.3.2 verified against user ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p LightArtStudio/app/src/main/assets
          curl -fL --retry 5 --retry-delay 2 'https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.min.js' -o LightArtStudio/app/src/main/assets/p5.min.js
          curl -fL --retry 5 --retry-delay 2 'https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.webgpu.min.js' -o LightArtStudio/app/src/main/assets/p5.webgpu.min.js
          echo '87adc350e8ec0e9bced22d4f03c181bdd208dc997d3956ab3ec2e90537643c9a  LightArtStudio/app/src/main/assets/p5.min.js' | sha256sum -c -
          echo 'd563c26b4c0d9eae35899ebb7ceb1ffe0708b317b0ff0ab633a4a395b571342c  LightArtStudio/app/src/main/assets/p5.webgpu.min.js' | sha256sum -c -
          cat > LightArtStudio/THIRD_PARTY_NOTICES.md <<'EOF'
          # Third-party notices

          ## p5.js 2.3.2
          LightArt Studio bundles p5.min.js and p5.webgpu.min.js from the official p5.js 2.3.2 distribution.
          p5.js is licensed under the GNU Lesser General Public License v2.1.
          The p5.sound.min.js file present in the complete-library ZIP is not bundled because the official p5.js download page marks that copy as outdated and incompatible with p5.js 2.x.
          EOF
          cat > LightArtStudio/BUILD_NOTES.md <<'EOF'
          # v1.5 build notes
          - Native DSL + p5.js Direct + GLSL Direct automatic runtime selection.
          - p5.js 2.3.2 core and WebGPU addon are bundled offline in APK assets.
          - Added #つぶやきProcessing chain compatibility for forms such as stroke(...).point(...), background(...).stroke(...), and rotate(...).image(...).
          - versionCode 6 / versionName 1.5.
          - Same fixed development signing key as v1.3/v1.4.
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: LightArtStudio
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK, p5 assets, version, ABIs and signer
        shell: bash
        run: |
          set -euxo pipefail
          APK=LightArtStudio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" LightArtStudio-v1.5-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee APK_BADGING.txt
          unzip -l "$APK" | tee APK_CONTENTS.txt
          keytool -printcert -jarfile "$APK" | tee APK_CERT.txt
          grep -q "versionCode='6'" APK_BADGING.txt
          grep -q "versionName='1.5'" APK_BADGING.txt
          grep -q 'assets/p5.min.js' APK_CONTENTS.txt
          grep -q 'assets/p5.webgpu.min.js' APK_CONTENTS.txt
          grep -q 'lib/arm64-v8a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/armeabi-v7a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/x86_64/liblightart.so' APK_CONTENTS.txt
          grep -q 'B0:C4:1E:9F:00:80:18:3D:96:20:93:84:4C:B5:8E:FE:6E:3C:1D:20:2A:E2:A1:00:1A:55:1B:58:FF:BE:6B:52' APK_CERT.txt
          cd LightArtStudio
          zip -qr ../LightArtStudio-v1.5-source-built.zip . -x '.gradle/*' 'build/*' 'app/build/*' 'app/.cxx/*' '*.iml' '.idea/*'
          cd ..
          sha256sum LightArtStudio-v1.5-debug.apk LightArtStudio-v1.5-source-built.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LightArtStudio-v1.5
          path: |
            LightArtStudio-v1.5-debug.apk
            LightArtStudio-v1.5-source-built.zip
            APK_BADGING.txt
            APK_CONTENTS.txt
            APK_CERT.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
