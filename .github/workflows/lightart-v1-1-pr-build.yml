name: Temporary LightArt Studio v1.1 PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat lightart_payload/part00 lightart_payload/part01 lightart_payload/part02 lightart_payload/part03.0 lightart_payload/part03.1 lightart_payload/part03.2 lightart_payload/part03.3 lightart_payload/part03.4 lightart_payload/tail > src.b64
          echo 'ade0f8df78e7b5febe3329fc3ef2cae13a8649fe70ed2ca1b17641a7fa937e8a  src.b64' | sha256sum -c -
          base64 -d src.b64 > source.zip
          echo '0d1a66a5351c8c34efb76579a51ecd417508e93600d51214ba37723a0af24b5e  source.zip' | sha256sum -c -
          unzip -q source.zip -d LightArtStudio
          test -f LightArtStudio/app/src/main/cpp/native_art.c
          test -f LightArtStudio/app/src/main/res/drawable/ic_launcher.xml
          test -f LightArtStudio/app/src/main/res/drawable-nodpi/ic_launcher_art.webp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: LightArtStudio
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify outputs
        shell: bash
        run: |
          set -euxo pipefail
          APK=LightArtStudio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" LightArtStudio-v1.1-debug.apk
          unzip -l "$APK" | tee APK_CONTENTS.txt
          grep -q 'lib/arm64-v8a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/armeabi-v7a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/x86_64/liblightart.so' APK_CONTENTS.txt
          cd LightArtStudio
          zip -qr ../LightArtStudio-v1.1-source.zip . -x '.gradle/*' 'build/*' 'app/build/*' 'app/.cxx/*' '*.iml' '.idea/*'
          cd ..
          sha256sum LightArtStudio-v1.1-debug.apk LightArtStudio-v1.1-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LightArtStudio-v1.1
          path: |
            LightArtStudio-v1.1-debug.apk
            LightArtStudio-v1.1-source.zip
            APK_CONTENTS.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
