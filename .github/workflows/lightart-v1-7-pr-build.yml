name: Temporary LightArt Studio v1.7 PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v1.6 source
        shell: bash
        run: |
          set -euxo pipefail
          cat v15_payload/part00a v15_payload/part00b v15_payload/part01 v15_payload/part02 v15_payload/part03 v15_payload/part04 v15_payload/part05 v15_payload/part06 v15_payload/part07 v15_payload/part08 > v15_source.b64
          echo 'bf175c4236c56e8ab7738a3e7bd9d750903266114c7134efe6776255f2005f5d  v15_source.b64' | sha256sum -c -
          base64 -d v15_source.b64 > v15_source.zip
          echo 'eb3c603786e6bb8cbb94a41b0ee20320df8d81bcefb442f2c74766772fa982c8  v15_source.zip' | sha256sum -c -
          mkdir LightArtStudio
          unzip -q v15_source.zip -d LightArtStudio
          cp v15_overlay/ScriptWebView.java LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java

          cat v16_payload/part00 v16_payload/part01 v16_payload/part02 v16_payload/part03 v16_payload/part04 v16_payload/part05 v16_payload/part06 v16_payload/part07 > v16_overlay.b64
          echo '466e6027d7bdeb9df0927632fedc46f3c5bc73c1ffef61c5c668740dc1f84476  v16_overlay.b64' | sha256sum -c -
          base64 -d v16_overlay.b64 > v16_overlay.zip
          echo '0343ebd05bdd0b2f531f9fffbf1afbf650e4660830a3dbd9fa2f6a0b3928d334  v16_overlay.zip' | sha256sum -c -
          unzip -oq v16_overlay.zip -d LightArtStudio

      - name: Apply v1.7 landscape and adaptive-render patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('LightArtStudio/app/build.gradle')
          s=p.read_text().replace('versionCode 7','versionCode 8').replace("versionName '1.6'","versionName '1.7'")
          p.write_text(s)

          p=Path('LightArtStudio/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:screenOrientation="unspecified"\n            android:exported="true"','android:screenOrientation="unspecified"\n            android:configChanges="orientation|screenSize|keyboardHidden"\n            android:exported="true"')
          p.write_text(s)

          p=Path('LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptRuntime.java')
          s=p.read_text()
          s=s.replace('package com.xperiatk.lightart;\n\nfinal class ScriptRuntime {','package com.xperiatk.lightart;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\nfinal class ScriptRuntime {')
          block='''\n    // 1 = landscape, -1 = portrait, 0 = keep current orientation.\n    static int preferredOrientation(String script, Mode mode) {\n        String s = script == null ? "" : script;\n        if (mode == Mode.GLSL) return 1;\n        double[] wh = null;\n        if (mode == Mode.P5JS) wh = firstSize(s, "createCanvas\\\\s*\\\\(\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*,\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)");\n        else if (mode == Mode.DSL) wh = firstSize(s, "(?m)^\\\\s*canvas\\\\s+(\\\\d+(?:\\\\.\\\\d+)?)\\\\s+(\\\\d+(?:\\\\.\\\\d+)?)");\n        else if (mode == Mode.PROCESSING_PY) wh = firstSize(s, "size\\\\s*\\\\(\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*,\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)");\n        if (wh == null || wh[1] <= 0) return 0;\n        double ratio = wh[0] / wh[1];\n        if (ratio >= 1.20) return 1;\n        if (ratio <= 0.83) return -1;\n        return 0;\n    }\n    private static double[] firstSize(String source, String regex) {\n        try { Matcher m = Pattern.compile(regex, Pattern.CASE_INSENSITIVE).matcher(source); if (!m.find()) return null; return new double[]{Double.parseDouble(m.group(1)), Double.parseDouble(m.group(2))}; }\n        catch (Exception ignored) { return null; }\n    }\n'''
          pos=s.index('    static String label(')
          s=s[:pos]+block+s[pos:]
          p.write_text(s)

          p=Path('LightArtStudio/app/src/main/java/com/xperiatk/lightart/MainActivity.java')
          s=p.read_text()
          s=s.replace('import android.content.Intent;\n','import android.content.Intent;\nimport android.content.pm.ActivityInfo;\n')
          s=s.replace('    private void showEditor(ProjectStore.Project p) {\n','    private void showEditor(ProjectStore.Project p) {\n        restoreFlexibleOrientation();\n')
          s=s.replace('        playingMode = ScriptRuntime.detect(playingScript);\n','        playingMode = ScriptRuntime.detect(playingScript);\n        applyPlayerOrientation();\n')
          methods='''    private void applyPlayerOrientation() {\n        int pref = ScriptRuntime.preferredOrientation(playingScript, playingMode);\n        if (pref > 0) setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);\n        else if (pref < 0) setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT);\n        else setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);\n    }\n\n    private void restoreFlexibleOrientation() {\n        setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);\n    }\n\n'''
          s=s.replace('    private void togglePause() {',methods+'    private void togglePause() {')
          s=s.replace('    private void showProjectList() {\n        stopPlayer();','    private void showProjectList() {\n        stopPlayer();\n        restoreFlexibleOrientation();')
          p.write_text(s)

          p=Path('LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java')
          s=p.read_text()
          s=s.replace("const cvs=document.getElementById('c'),gl=cvs.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});window.__laPaused=false;window.__laSpeed=1;let held=0,last=performance.now(),frame=0,mouse=[0,0],fb=[],tex=[],ping=0,pr=null;","const cvs=document.getElementById('c'),gl=cvs.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});window.__laPaused=false;window.__laSpeed=1;let held=0,last=performance.now(),frame=0,mouse=[0,0],fb=[],tex=[],ping=0,pr=null,renderScale=1,ema=16.7,adaptAt=0;")
          s=s.replace("function rs(){let d=devicePixelRatio||1;cvs.width=Math.max(1,Math.round(innerWidth*d));cvs.height=Math.max(1,Math.round(innerHeight*d));cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px';gl.viewport(0,0,cvs.width,cvs.height);targets();}addEventListener('resize',rs);","function rs(){let d=(devicePixelRatio||1)*renderScale,w=innerWidth*d,h=innerHeight*d,maxPx=3000000,cap=Math.min(1,Math.sqrt(maxPx/Math.max(1,w*h)));d*=cap;cvs.width=Math.max(1,Math.round(innerWidth*d));cvs.height=Math.max(1,Math.round(innerHeight*d));cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px';gl.viewport(0,0,cvs.width,cvs.height);targets();}addEventListener('resize',rs);")
          s=s.replace("function loop(now){requestAnimationFrame(loop);if(window.__laPaused){last=now;return}let dt=now-last;last=now;held+=dt*(window.__laSpeed||1);frame++;let src=ping,dst=1-ping;","function loop(now){requestAnimationFrame(loop);if(window.__laPaused){last=now;return}let dt=now-last;last=now;if(dt>100)dt=16.7;ema=ema*.96+dt*.04;if(now-adaptAt>3000&&frame>120){let q=renderScale;if(ema>26){q=renderScale>.86?.85:renderScale>.71?.70:renderScale>.56?.55:.40}else if(ema<18){q=renderScale<.54?.55:renderScale<.69?.70:renderScale<.84?.85:1}if(q!==renderScale){renderScale=q;adaptAt=now;ema=20;rs();}}held+=dt*(window.__laSpeed||1);frame++;let src=ping,dst=1-ping;")
          p.write_text(s)
          PY

          grep -q 'versionCode 8' LightArtStudio/app/build.gradle
          grep -q "versionName '1.7'" LightArtStudio/app/build.gradle
          grep -q 'SCREEN_ORIENTATION_SENSOR_LANDSCAPE' LightArtStudio/app/src/main/java/com/xperiatk/lightart/MainActivity.java
          grep -q 'preferredOrientation' LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptRuntime.java
          grep -q 'maxPx=3000000' LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java
          grep -q 'renderScale>.86?.85' LightArtStudio/app/src/main/java/com/xperiatk/lightart/ScriptWebView.java

      - name: Bundle runtime assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p LightArtStudio/app/src/main/assets
          curl -fL --retry 5 --retry-delay 2 'https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.min.js' -o LightArtStudio/app/src/main/assets/p5.min.js
          curl -fL --retry 5 --retry-delay 2 'https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.webgpu.min.js' -o LightArtStudio/app/src/main/assets/p5.webgpu.min.js
          echo '87adc350e8ec0e9bced22d4f03c181bdd208dc997d3956ab3ec2e90537643c9a  LightArtStudio/app/src/main/assets/p5.min.js' | sha256sum -c -
          echo 'd563c26b4c0d9eae35899ebb7ceb1ffe0708b317b0ff0ab633a4a395b571342c  LightArtStudio/app/src/main/assets/p5.webgpu.min.js' | sha256sum -c -
          curl -fL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/doxas/twigl/fc09f1ecee8219b83bd1777844edb22a29d19ad2/src/shader_snippet/noise.glsl' -o LightArtStudio/app/src/main/assets/twigl_noise.glsl
          test -s LightArtStudio/app/src/main/assets/twigl_noise.glsl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: LightArtStudio
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and package
        shell: bash
        run: |
          set -euxo pipefail
          APK=LightArtStudio/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" LightArtStudio-v1.7-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee APK_BADGING.txt
          unzip -l "$APK" | tee APK_CONTENTS.txt
          keytool -printcert -jarfile "$APK" | tee APK_CERT.txt
          grep -q "versionCode='8'" APK_BADGING.txt
          grep -q "versionName='1.7'" APK_BADGING.txt
          grep -q 'assets/p5.min.js' APK_CONTENTS.txt
          grep -q 'assets/twigl_noise.glsl' APK_CONTENTS.txt
          grep -q 'lib/arm64-v8a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/armeabi-v7a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/x86_64/liblightart.so' APK_CONTENTS.txt
          grep -q 'B0:C4:1E:9F:00:80:18:3D:96:20:93:84:4C:B5:8E:FE:6E:3C:1D:20:2A:E2:A1:00:1A:55:1B:58:FF:BE:6B:52' APK_CERT.txt
          cd LightArtStudio
          zip -qr ../LightArtStudio-v1.7-source-built.zip . -x '.gradle/*' 'build/*' 'app/build/*' 'app/.cxx/*' '*.iml' '.idea/*'
          cd ..
          sha256sum LightArtStudio-v1.7-debug.apk LightArtStudio-v1.7-source-built.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LightArtStudio-v1.7
          path: |
            LightArtStudio-v1.7-debug.apk
            LightArtStudio-v1.7-source-built.zip
            APK_BADGING.txt
            APK_CONTENTS.txt
            APK_CERT.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
