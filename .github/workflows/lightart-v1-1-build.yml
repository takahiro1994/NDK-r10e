name: Build LightArt Studio v1.1

on:
  push:
    branches:
      - agent/lightart-studio-v1-1-build
    paths:
      - 'lightart_payload/**'
      - '.github/workflows/lightart-v1-1-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat lightart_payload/part00 lightart_payload/part01 lightart_payload/part02 lightart_payload/part03 lightart_payload/tail > LightArtStudio_buildsrc.b64
          echo 'ade0f8df78e7b5febe3329fc3ef2cae13a8649fe70ed2ca1b17641a7fa937e8a  LightArtStudio_buildsrc.b64' | sha256sum -c -
          base64 -d LightArtStudio_buildsrc.b64 > LightArtStudio_buildsrc.zip
          echo '0d1a66a5351c8c34efb76579a51ecd417508e93600d51214ba37723a0af24b5e  LightArtStudio_buildsrc.zip' | sha256sum -c -
          unzip -q LightArtStudio_buildsrc.zip -d LightArtStudio
          test -f LightArtStudio/app/src/main/cpp/native_art.c
          test -f LightArtStudio/app/src/main/res/drawable/ic_launcher.xml
          test -f LightArtStudio/app/src/main/res/drawable-nodpi/ic_launcher_art.webp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: LightArtStudio
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euxo pipefail
          APK='LightArtStudio/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" LightArtStudio-v1.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging LightArtStudio-v1.1-debug.apk | tee APK_BADGING.txt
          unzip -l LightArtStudio-v1.1-debug.apk | tee APK_CONTENTS.txt
          grep -q 'lib/arm64-v8a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/armeabi-v7a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/x86_64/liblightart.so' APK_CONTENTS.txt
          grep -q 'drawable-nodpi.*ic_launcher_art' APK_CONTENTS.txt || true
          cd LightArtStudio
          zip -qr ../LightArtStudio-v1.1-source.zip . -x '.gradle/*' 'build/*' 'app/build/*' 'app/.cxx/*' '*.iml' '.idea/*'
          cd ..
          sha256sum LightArtStudio-v1.1-debug.apk LightArtStudio-v1.1-source.zip | tee SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightArtStudio-v1.1
          path: |
            LightArtStudio-v1.1-debug.apk
            LightArtStudio-v1.1-source.zip
            APK_BADGING.txt
            APK_CONTENTS.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
