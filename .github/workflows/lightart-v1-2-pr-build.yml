name: Temporary LightArt Studio v1.2 PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified v1.1 base and apply v1.2 overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat lightart_payload/part00 lightart_payload/part01 lightart_payload/part02 lightart_payload/part03.0 lightart_payload/part03.1 lightart_payload/part03.2 lightart_payload/part03.3 lightart_payload/part03.4.0 lightart_payload/part03.4.1 lightart_payload/part03.4.2 lightart_payload/part03.4.3 lightart_payload/part03.4.4 lightart_payload/tail > base.b64
          echo 'ade0f8df78e7b5febe3329fc3ef2cae13a8649fe70ed2ca1b17641a7fa937e8a  base.b64' | sha256sum -c -
          base64 -d base.b64 > base.zip
          echo '0d1a66a5351c8c34efb76579a51ecd417508e93600d51214ba37723a0af24b5e  base.zip' | sha256sum -c -
          unzip -q base.zip -d LightArtStudio
          cp v12_overlay/BUILD_NOTES.md LightArtStudio/BUILD_NOTES.md
          cp v12_overlay/README.md LightArtStudio/README.md
          cp v12_overlay/app_build.gradle LightArtStudio/app/build.gradle
          cp v12_overlay/ArtGLSurfaceView.java LightArtStudio/app/src/main/java/com/xperiatk/lightart/ArtGLSurfaceView.java
          cp v12_overlay/MainActivity.java LightArtStudio/app/src/main/java/com/xperiatk/lightart/MainActivity.java
          cp v12_overlay/ProjectStore.java LightArtStudio/app/src/main/java/com/xperiatk/lightart/ProjectStore.java
          grep -q "versionName '1.2'" LightArtStudio/app/build.gradle
          grep -q '画面のみ' LightArtStudio/app/src/main/java/com/xperiatk/lightart/MainActivity.java
          grep -q 'Organic Ribbon' LightArtStudio/app/src/main/java/com/xperiatk/lightart/ProjectStore.java
          test -f LightArtStudio/app/src/main/res/drawable-nodpi/ic_launcher_art.webp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: LightArtStudio
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify outputs
        shell: bash
        run: |
          set -euxo pipefail
          APK=LightArtStudio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" LightArtStudio-v1.2-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee APK_BADGING.txt
          unzip -l "$APK" | tee APK_CONTENTS.txt
          grep -q "versionName='1.2'" APK_BADGING.txt
          grep -q 'lib/arm64-v8a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/armeabi-v7a/liblightart.so' APK_CONTENTS.txt
          grep -q 'lib/x86_64/liblightart.so' APK_CONTENTS.txt
          cd LightArtStudio
          zip -qr ../LightArtStudio-v1.2-source-built.zip . -x '.gradle/*' 'build/*' 'app/build/*' 'app/.cxx/*' '*.iml' '.idea/*'
          cd ..
          sha256sum LightArtStudio-v1.2-debug.apk LightArtStudio-v1.2-source-built.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LightArtStudio-v1.2
          path: |
            LightArtStudio-v1.2-debug.apk
            LightArtStudio-v1.2-source-built.zip
            APK_BADGING.txt
            APK_CONTENTS.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
